services:
  db:
    # PostgreSQL 17 with the pgvector extension (optional vector retrieval, README section 9d).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jobhunt
      POSTGRES_PASSWORD: jobhunt
      POSTGRES_DB: jobhunt
    volumes:
      - pgdata:/var/lib/postgresql/data
  litellm:
    # Self-hosted LiteLLM proxy (open source, not LiteLLM's commercial cloud) configured for DeepSeek.
    # STORE_MODEL_IN_DB + DATABASE_URL: admin_api mode, needed for both model discovery (GET /model/info) and
    # Job Hunt OS applying model/tier changes live (no proxy restart). Own database (not jobhunt's): LiteLLM's
    # Prisma migrations refuse to run against a database with pre-existing, unrelated schema history. On a
    # fresh install, create it once: `docker compose exec db psql -U jobhunt -d jobhunt -c "CREATE DATABASE litellm OWNER jobhunt;"`
    # (needed again after `docker compose down -v`, since that drops the Postgres volume).
    image: ghcr.io/berriai/litellm:main-stable
    ports: ["4000:4000"]
    volumes:
      - ./integrations/litellm/config.deepseek.yaml:/app/config.yaml:ro
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      STORE_MODEL_IN_DB: "True"
      DATABASE_URL: postgresql://jobhunt:jobhunt@db:5432/litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on: [db]
  web:
    build: .
    # Headless Chromium (job-description recovery) uses shared memory; the app also passes --disable-dev-shm-usage.
    shm_size: "512m"
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://jobhunt:jobhunt@db:5432/jobhunt
    depends_on: [db, litellm]
volumes:
  pgdata:
